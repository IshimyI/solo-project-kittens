server {
    server_name catventure.ru www.catventure.ru;

    root /var/www/catventure/client;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:4009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/catventure.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/catventure.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.catventure.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = catventure.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name catventure.ru www.catventure.ru;
    return 404; # managed by Certbot




}